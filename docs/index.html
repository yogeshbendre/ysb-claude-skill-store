<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover and share reusable Claude Code skills — slash commands for repeatable workflows.">
  <title>Claude Skills Hub</title>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('claude-skills-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon">⚡</span>
          <div>
            <h1 class="brand-name">Claude Skills Hub</h1>
            <p class="brand-sub">Discover and share Claude Code skills</p>
          </div>
        </div>
        <div class="header-actions">
          <span id="count" class="header-badge">Loading…</span>
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">🌙</button>
        </div>
      </div>
    </div>
  </header>

  <div class="controls container">
    <div class="controls-row">
      <input type="search" id="search" placeholder="Search skills by name, description, or tag…" autocomplete="off">
      <button id="filter-toggle" class="filter-toggle-btn" aria-label="Open filters">
        <span>Filters</span>
        <span id="filter-count-badge" class="filter-count-badge" hidden>0</span>
      </button>
    </div>
  </div>

  <main class="container">
    <div class="page-layout">
      <aside id="filter-panel" class="filter-panel">
        <div class="filter-panel-head">
          <h2>Filters</h2>
          <div class="filter-panel-head-actions">
            <button id="clear-filters" class="clear-filters-btn" type="button">Clear all</button>
            <button id="filter-close" class="filter-close-btn" type="button" aria-label="Close filters">✕</button>
          </div>
        </div>
        <div class="filter-body" id="filter-body"></div>
      </aside>

      <div class="results-col">
        <div id="active-filters" class="active-filters"></div>
        <div id="grid" class="grid" role="list">
          <p class="empty">Loading skills…</p>
        </div>
      </div>

      <div id="filter-overlay" class="filter-overlay"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        Built for the Claude Code community ·
        <a href="https://github.com/yogeshbendre/ysb-claude-skill-store" target="_blank" rel="noopener noreferrer">GitHub</a> ·
        <a href="https://github.com/yogeshbendre/ysb-claude-skill-store/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener noreferrer">Contribute a Skill</a>
      </p>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
